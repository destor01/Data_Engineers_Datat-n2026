# =====================================================================
# Catálogos de códigos de Quality Audit
#
# Cada catálogo se arma de una de estas formas:
#   diccionario: une los valores de una o más variables de los diccionarios
#                del INE (archivo + etiqueta exacta de la columna "Valor").
#   cie10:       lee la hoja CIE-10 del diccionario de defunciones.
#   valores:     lista escrita aquí (bases sin diccionario oficial).
#
# ignorado: códigos que significan "sin dato". Si el diccionario no los
#           trae, el script los agrega con la etiqueta "Ignorado".
# Si dos variables traen el mismo código con distinta etiqueta
# ("Soltero"/"Soltera") se queda la primera y la otra se registra
# como equivalencia de texto.
# =====================================================================

catalogos:

  # ---------------- Compartidos por varias bases ----------------
  DEPARTAMENTO:
    nombre: Departamentos de Guatemala
    diccionario:
      - [dicc_defunciones, Departamento de registro]
      - [dicc_defunciones, Departamento de nacimiento del difunto(a)]
    ignorado: ["99"]

  MUNICIPIO:
    nombre: Municipios de Guatemala (código DDMM)
    diccionario:
      - [dicc_defunciones, Municipio de registro]
      - [dicc_defunciones, Municipio de nacimiento del difunto(a)]
    padre: departamento_por_prefijo   # 0101 -> 1, 2217 -> 22
    ignorado: ["9999"]

  PAIS:
    nombre: Países (codificación INE)
    diccionario:
      - [dicc_defunciones, Pais de nacimiento del difunto(a)]
      - [dicc_defunciones, Nacionalidad del difunto(a)]
      - [dicc_defunciones, Pais de residencia del difunto(a)]
      - [dicc_nacimientos, País de residencia del padre]
      - [dicc_nacimientos, País de nacimiento del padre]
      - [dicc_nacimientos, País de residencia de la madre]
      - [dicc_nacimientos, País de nacimiento de la madre]
    ignorado: ["9999"]

  MES:
    nombre: Meses del año
    diccionario:
      - [dicc_defunciones, Mes de ocurrencia]

  SEXO:
    nombre: Sexo
    diccionario:
      - [dicc_pnc, SEXO]
    ignorado: ["9"]

  PUEBLO:
    nombre: Pueblo de pertenencia
    diccionario:
      - [dicc_defunciones, Pueblo de pertenencia del difunto(a)]
    ignorado: ["9"]

  ESTADO_CIVIL:
    nombre: Estado civil
    diccionario:
      - [dicc_defunciones, Estado civil del difunto(a)]
      - [dicc_nacimientos, Estado civil de la madre]
    ignorado: ["9"]

  ESCOLARIDAD:
    nombre: Escolaridad
    diccionario:
      - [dicc_defunciones, Escolaridad del difunto(a)]
    ignorado: ["9"]

  OCUPACION_CIUO08:
    nombre: Ocupación (subgrupos CIUO-08)
    diccionario:
      - [dicc_defunciones, Ocupación (Subgrupos CIUO-08) del difunto(a)]
      - [dicc_nacimientos, Ocupación (Subgrupos CIUO-08) del padre]
      - [dicc_nacimientos, Ocupación (Subgrupos CIUO-08) de la madre]
    rellenar_ceros: 2       # el diccionario usa "01", "03"
    ignorado: ["99"]

  CIE10:
    nombre: Clasificación Internacional de Enfermedades CIE-10
    cie10: [dicc_defunciones, CIE-10]
    padre: cie10_categoria    # A000 -> A00

  # ---------------- Defunciones ----------------
  DEF_PERIODO_EDAD:
    nombre: Periodo de edad del difunto
    diccionario: [[dicc_defunciones, Periodo de edad del difunto(a)]]
    ignorado: ["9"]
  DEF_ASISTENCIA:
    nombre: Asistencia recibida (defunciones)
    diccionario: [[dicc_defunciones, Asistencia recibida]]
    ignorado: ["9"]
  DEF_SITIO:
    nombre: Sitio de ocurrencia (defunciones)
    diccionario: [[dicc_defunciones, Sitio de ocurrencia]]
    ignorado: ["9"]
  DEF_CERTIFICA:
    nombre: Quién certifica la defunción
    diccionario: [[dicc_defunciones, Quien certifica]]
    ignorado: ["9"]

  # ---------------- Nacimientos ----------------
  NAC_TIPO_INSCRIPCION:
    nombre: Tipo de inscripción
    diccionario: [[dicc_nacimientos, Tipo de inscripción]]
  NAC_TIPO_PARTO:
    nombre: Tipo de parto
    diccionario: [[dicc_nacimientos, Tipo de parto]]
  NAC_VIA_PARTO:
    nombre: Vía del parto
    diccionario: [[dicc_nacimientos, Via del parto]]
  NAC_ASISTENCIA:
    nombre: Asistencia recibida (nacimientos)
    diccionario: [[dicc_nacimientos, Asistencia recibida]]
    ignorado: ["9"]
  NAC_SITIO:
    nombre: Sitio de ocurrencia (nacimientos)
    diccionario: [[dicc_nacimientos, Sitio de ocurrencia]]
    ignorado: ["9"]

  # ---------------- PNC detenidos ----------------
  PNC_DIA_SEMANA:
    nombre: Día de la semana
    diccionario: [[dicc_pnc, DIA DE OCURRENCIA]]
    ignorado: ["9"]
  PNC_GRUPO_HORA_6:
    nombre: Grupo de cada 6 horas
    diccionario: [[dicc_pnc, GRUPO DE CADA 6 HORAS]]
    ignorado: ["5"]
  PNC_GRUPO_HORA_3:
    nombre: Grupo mañana, tarde y noche
    diccionario: [[dicc_pnc, "GRUPO DE HORA MAÑANA,TARDE Y NOCHE"]]
    ignorado: ["4"]
  PNC_GRUPO_EDAD_60:
    nombre: Grupo de edad (menor de 15 hasta 60 y más)
    diccionario: [[dicc_pnc, GRUPO DE EDAD QUINQUENAL (MENOR 15 HASTA 60 Y MÁS)]]
    ignorado: ["12"]
  PNC_GRUPO_EDAD_80:
    nombre: Grupo de edad (menor de 15 hasta 80 y más)
    diccionario: [[dicc_pnc, GRUPO DE EDAD QUINQUENAL (MENOR 15 HASTA 80 Y MÁS)]]
    ignorado: ["16"]
  PNC_EDAD_QUINQUENAL:
    nombre: Edades quinquenales (0 hasta 80 y más)
    diccionario: [[dicc_pnc, EDADES QUINQUENALES (A PARTIR DE 0 HASTA 80 Y MÁS)]]
    ignorado: ["18"]
  PNC_GRUPO_CAUSA:
    nombre: Grupo de causas
    diccionario: [[dicc_pnc, GRUPO DE CAUSAS]]
  PNC_CAUSA:
    nombre: Causa cometida
    diccionario: [[dicc_pnc, CAUSA COMETIDA]]
    ignorado: ["68"]
    # Grupo de causas (PNC_GRUPO_CAUSA) de cada causa. Sale de la base publicada
    # PNC 2023 (delito_com -> g_delitos) y, para las que no aparecen ahí, del nombre.
    # Sin asignar, por confirmar con el INE: 16 Autosecuestro, 34 Cobro ilegal de
    # impuesto a buses, 37 Impuesto a negocios, 38 En desalojos de fincas,
    # 44 Siembra y cultivo de drogas, 63 Tenencia de licores clandestinos.
    padres:
      "1": [1, 2, 3, 4, 5, 6]
      "2": [7, 8, 9, 10, 11]
      "3": [19, 20, 21, 22, 23, 24, 27, 28, 29, 30, 31, 32, 33, 35, 36]
      "5": [15]
      "6": [40]
      "7": [12, 17, 25, 26, 39, 41, 42, 43, 45, 46, 47, 48, 49, 50, 51, 55, 56, 58, 59, 60, 61, 62, 64, 65, 66, 67, 68]

  # ---------------- Calidad del aire (sin diccionario oficial) ----------------
  # Tomado de la base publicada "BASE MONITOREO AIRE 2025 INSIVUMEH".
  AIRE_ESTACION:
    nombre: Estaciones de monitoreo del aire INSIVUMEH
    valores:
      - {codigo: RADIO_SONDA,    etiqueta: Radio Sonda,     padre: "0101"}
      - {codigo: INSIVUMEH,      etiqueta: INSIVUMEH,       padre: "0101"}
      - {codigo: GUATEMALA,      etiqueta: Guatemala,       padre: "0101"}
      - {codigo: PROGRESO,       etiqueta: Progreso,        padre: "0201"}
      - {codigo: PANAJACHEL,     etiqueta: Panajachel,      padre: "0710"}
      - {codigo: QUETZALTENANGO, etiqueta: Quetzaltenango,  padre: "0901"}
      - {codigo: LOS_ALTOS,      etiqueta: Los Altos,       padre: "0924"}
      - {codigo: SALAMA,         etiqueta: Salamá,          padre: "1501"}
      - {codigo: CORREOS,        etiqueta: Correos,         padre: "1601"}
      - {codigo: SANTA_ELENA,    etiqueta: Santa Elena,     padre: "1701"}
      - {codigo: CUNIZAB,        etiqueta: Cunizab,         padre: "1801"}
      - {codigo: MAGA,           etiqueta: MAGA,            padre: "2001"}
    # Encabezados con que llegan en el crudo (fila 1 del Excel de INSIVUMEH)
    equivalencias:
      RADIO SONDA - CIUDAD DE GUATEMALA: RADIO_SONDA
      INSIVUMEH - CIUDAD DE GUATEMALA: INSIVUMEH
      LOS ALTOS - QUETZALTENANGO: LOS_ALTOS
      SANTA ELENA - PETEN: SANTA_ELENA
      CORREOS - COBAN: CORREOS
      PANAJACHEL - SOLOLA: PANAJACHEL
      CUNIZAB - PUERTO BARRIOS: CUNIZAB
      MUNICIPALIDAD SALAMA - SALAMA: SALAMA
      MAGA - CHIQUIMULA: MAGA
      CUN PROGRESO USAC - EL PROGRESO: PROGRESO

  AIRE_PM:
    nombre: Tipo de material particulado
    valores:
      - {codigo: "10",  etiqueta: PM10}
      - {codigo: "2.5", etiqueta: PM2.5}
    equivalencias:
      PM 10 (UG/M3): "10"
      PM2.5 (UG/M3): "2.5"
      PM 2.5 (UG/M3): "2.5"

  # ---------------- Emergencias SECONRED (sin diccionario oficial) ----------------
  # Tomado de la base publicada "Base eventos_22_CONRED".
  EMERG_AMENAZA:
    nombre: Amenaza
    valores:
      - {codigo: HIDROMETEOROLOGICO,    etiqueta: HIDROMETEOROLOGICO}
      - {codigo: MATERIALES_PELIGROSOS, etiqueta: MATERIALES PELIGROSOS}
      - {codigo: GEOLOGICO,             etiqueta: GEOLOGICO}
      - {codigo: SOCIO_ORGANIZATIVO,    etiqueta: SOCIO-ORGANIZATIVO}

  EMERG_SUBTIPO:
    nombre: Subtipo de amenaza
    valores:
      - {codigo: LLUVIAS_HURACANES,       etiqueta: LLUVIAS Y HURACANES,     padre: HIDROMETEOROLOGICO}
      - {codigo: DESCENSO_TEMPERATURA,    etiqueta: DESCENSO TEMPERATURA,    padre: HIDROMETEOROLOGICO}
      - {codigo: INCENDIO,                etiqueta: INCENDIO,                padre: MATERIALES_PELIGROSOS}
      - {codigo: SISMICO,                 etiqueta: SISMICO,                 padre: GEOLOGICO}
      - {codigo: VULCANOLOGICO,           etiqueta: VULCANOLOGICO,           padre: GEOLOGICO}
      - {codigo: MOVIMIENTO_MASA,         etiqueta: MOVIMIENTO DE MASA,      padre: GEOLOGICO}
      - {codigo: CONCENTRACIONES_MASIVAS, etiqueta: CONCENTRACIONES MASIVAS, padre: SOCIO_ORGANIZATIVO}
      - {codigo: MANIFESTACIONES,         etiqueta: MANIFESTACIONES,         padre: SOCIO_ORGANIZATIVO}


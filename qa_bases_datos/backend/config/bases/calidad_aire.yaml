# Calidad del aire — INSIVUMEH
# Estructura: base publicada "BASE MONITOREO AIRE 2025 INSIVUMEH" (formato largo:
#             una fila por estación, fecha, hora y tipo de PM)
# Crudo:      "Datos de Calidad del aire_INSIVUMEH_2025.xlsx" (formato ancho: fila 1 =
#             estación, fila 2 = PM10/PM2.5, una columna por estación y PM)
# No hay diccionario oficial: catálogos en catalogos.yaml (AIRE_ESTACION, AIRE_PM).
#
# formato_crudo le dice al lector cómo pasar de ancho a largo.

base: CALIDAD_AIRE
version: "2025"
vigente_desde: 2025-01-01
fuente: "Estructura de BASE MONITOREO AIRE 2025 INSIVUMEH publicada"

formato_crudo:
  tipo: ancho_a_largo
  filas_encabezado: 2            # fila 1: estación (celdas combinadas), fila 2: PM
  columnas_fijas: [Mes, Fecha, Hora]
  nivel_1: estación               # -> catálogo AIRE_ESTACION
  nivel_2: pm                     # -> catálogo AIRE_PM
  columna_valor: valor

variables:
  - {nombre: cod_depto, etiqueta: Código de departamento, tipo: codigo, catalogo: DEPARTAMENTO, requerida: true, alias: [],
     transformacion: {tipo: depto_de_municipio, campo: cod_muni}}
  - {nombre: departamento, etiqueta: Departamento, tipo: texto, alias: [],
     transformacion: {tipo: etiqueta_catalogo, campo: cod_depto, catalogo: DEPARTAMENTO}}
  - {nombre: cod_muni, etiqueta: Código de municipio, tipo: codigo, catalogo: MUNICIPIO, requerida: true, alias: [],
     transformacion: {tipo: padre_catalogo, campo: estación, catalogo: AIRE_ESTACION}}
  - {nombre: municipio, etiqueta: Municipio, tipo: texto, alias: [],
     transformacion: {tipo: etiqueta_catalogo, campo: cod_muni, catalogo: MUNICIPIO}}
  - {nombre: estación, etiqueta: Estación de monitoreo, tipo: codigo, catalogo: AIRE_ESTACION, requerida: true, alias: [ESTACION]}
  - {nombre: cod_mes, etiqueta: Código de mes, tipo: codigo, catalogo: MES, requerida: true, alias: [],
     transformacion: {tipo: parte_fecha, campo: Fecha, parte: mes}}
  - {nombre: mes, etiqueta: Mes, tipo: texto, alias: [Mes],
     transformacion: {tipo: etiqueta_catalogo, campo: cod_mes, catalogo: MES}}
  - {nombre: fehca, etiqueta: Fecha (así se llama en la publicación), tipo: fecha, requerida: true, alias: [Fecha, FECHA]}
  - {nombre: hora, etiqueta: Hora, tipo: hora, requerida: true, alias: [Hora, HORA]}
  - {nombre: pm, etiqueta: Tipo de material particulado, tipo: codigo, catalogo: AIRE_PM, requerida: true, alias: [PM]}
  - {nombre: unidad de medida, etiqueta: Unidad de medida, tipo: texto, alias: [],
     transformacion: {tipo: constante, valor: ug/m3}}
  - {nombre: valor, etiqueta: Concentración en µg/m³, tipo: decimal, min: 0, alias: [VALOR]}

llave: [estación, fehca, hora, pm]

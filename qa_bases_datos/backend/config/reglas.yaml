# =====================================================================
# Reglas de calidad de Quality Audit
#
# codigo     lo usa el motor para encontrar la función que la evalúa
# base       null = genérica (corre en todas las bases)
# dimension  estructura | completitud | validez | consistencia | unicidad |
#            oportunidad | representatividad
# severidad  error (baja el puntaje completo) | advertencia (baja la mitad) |
#            info (no baja el puntaje)
# accion     auto_corregir | sugerir | reportar | excluir
#
# Los mensajes usan {n} (registros afectados), {columna} y {detalle}.
# Las reglas de llave única (<BASE>_LLAVE_UNICA) se crean desde cada YAML de bases/.
# =====================================================================

reglas:

  # ------------------------- Estructura -------------------------
  GEN_COLUMNA_FALTANTE:
    nombre: Falta una columna obligatoria
    dimension: estructura
    severidad: error
    accion: reportar
    mensaje: "No se encontró la columna {columna}, obligatoria en la base del INE."

  GEN_COLUMNA_DESCONOCIDA:
    nombre: Columna que no está en la definición de la base
    dimension: estructura
    severidad: info
    accion: reportar
    mensaje: "La columna {columna} no está en la definición de la base; no se publica. Si es una columna nueva, avise al INE para agregarla."

  GEN_COLUMNA_DUPLICADA:
    nombre: Encabezado de columna repetido
    dimension: estructura
    severidad: advertencia
    accion: reportar
    mensaje: "El encabezado {columna} aparece {detalle} veces. Se tomaron por posición; use nombres distintos."

  GEN_COLUMNA_VACIA:
    nombre: Columna vacía y sin nombre
    dimension: estructura
    severidad: info
    accion: auto_corregir
    mensaje: "Se eliminó la columna {columna}: no tiene encabezado ni datos."

  GEN_PII:
    nombre: Columna con datos personales
    dimension: estructura
    severidad: info
    accion: auto_corregir
    mensaje: "La columna {columna} contiene datos personales y se eliminó del archivo corregido."

  GEN_HOJAS_DISTINTAS:
    nombre: Hojas con estructura distinta
    dimension: estructura
    severidad: advertencia
    accion: reportar
    mensaje: "Las hojas no tienen los mismos encabezados: {detalle}."

  # ------------------------- Completitud -------------------------
  GEN_NULO_TEXTUAL:
    nombre: Texto usado como dato faltante
    dimension: completitud
    severidad: info
    accion: auto_corregir
    parametros:
      valores: ["N.D.", "ND", "N/D", "-1", "IGNORADO", "IGNORADA", "NO INDICA", "NULL", "NAN", "-", "--", "S/D"]
    mensaje: "{n} celdas de {columna} usan texto ({detalle}) para indicar que no hay dato; se dejaron vacías."

  GEN_SIN_DATO:
    nombre: Dato faltante
    dimension: completitud
    severidad: advertencia
    accion: auto_corregir
    mensaje: "{n} registros sin dato en {columna}; {detalle}."

  GEN_REQUERIDA:
    nombre: Falta un dato obligatorio
    dimension: completitud
    severidad: error
    accion: reportar
    mensaje: "{n} registros sin dato en {columna}, que es obligatoria."

  # ------------------------- Validez -------------------------
  GEN_ESPACIOS:
    nombre: Espacios sobrantes
    dimension: validez
    severidad: info
    accion: auto_corregir
    mensaje: "{n} celdas de {columna} tenían espacios al inicio, al final o dobles; se quitaron."

  GEN_CODIFICACION:
    nombre: Texto convertido al código oficial
    dimension: validez
    severidad: info
    accion: auto_corregir
    mensaje: "{n} valores de {columna} venían como texto y se convirtieron al código del INE ({detalle})."

  GEN_CATALOGO:
    nombre: Valor que no existe en el catálogo
    dimension: validez
    severidad: error
    accion: sugerir
    parametros:
      similitud_minima: 0.85
    mensaje: "{n} registros de {columna} tienen valores que no existen en el catálogo oficial: {detalle}."

  GEN_CODIFICACION_IA:
    nombre: Texto libre pendiente de codificar
    dimension: validez
    severidad: advertencia
    accion: sugerir
    parametros:
      confianza_minima: 0.8
    mensaje: "{n} registros de {columna} tienen texto libre sin código aprobado ({detalle} textos distintos); hay sugerencias para revisar."

  GEN_TIPO:
    nombre: Valor con tipo de dato incorrecto
    dimension: validez
    severidad: error
    accion: reportar
    mensaje: "{n} registros de {columna} no son {detalle}."

  GEN_RANGO:
    nombre: Valor fuera de rango
    dimension: validez
    severidad: advertencia
    accion: reportar
    mensaje: "{n} registros de {columna} están fuera del rango permitido ({detalle})."

  GEN_FORMATO:
    nombre: Formato incorrecto
    dimension: validez
    severidad: error
    accion: reportar
    mensaje: "{n} registros de {columna} no cumplen el formato {detalle}."

  # ------------------------- Calidad del aire -------------------------
  AIRE_MES_REPRESENTATIVO:
    base: CALIDAD_AIRE
    nombre: Mes no representativo por datos faltantes
    dimension: representatividad
    severidad: error
    accion: excluir
    parametros:
      max_horas_faltantes_dia: 4
      max_dias_invalidos_mes: 2
    mensaje: "{n} registros excluidos: {detalle}."

  AIRE_RANGO_PM:
    base: CALIDAD_AIRE
    nombre: Concentración de PM fuera de rango plausible
    dimension: validez
    severidad: advertencia
    accion: reportar
    parametros:
      max: 500
    mensaje: "{n} lecturas mayores a {detalle} µg/m³; revise si es falla del sensor."

  # ------------------------- Defunciones -------------------------
  DEF_PERIODO_OCURRENCIA:
    base: DEFUNCIONES
    nombre: Defunción ocurrida fuera del año de la carga
    dimension: oportunidad
    severidad: advertencia
    accion: excluir
    parametros:
      columna_anio: Añoocu
    mensaje: "{n} defunciones ocurrieron en otro año ({detalle}); se excluyen de la base del período."

  DEF_OCURRIO_EXTRANJERO:
    base: DEFUNCIONES
    nombre: Defunción ocurrida fuera de Guatemala
    dimension: validez
    severidad: info
    accion: excluir
    parametros:
      columna: PAIS_OCURRENCIA
      valor: "320"
    mensaje: "{n} defunciones ocurrieron fuera de Guatemala ({detalle}); no entran en la estadística nacional."

  DEF_FECHA_COHERENCIA:
    base: DEFUNCIONES
    nombre: Día, mes y año no coinciden con la fecha de defunción
    dimension: consistencia
    severidad: error
    accion: reportar
    mensaje: "{n} registros con día, mes o año de ocurrencia distintos a FECHA_DEFUNCION."

  # ------------------------- Nacimientos -------------------------
  NAC_PERIODO_OCURRENCIA:
    base: NACIMIENTOS
    nombre: Nacimiento ocurrido fuera del año de la carga
    dimension: oportunidad
    severidad: advertencia
    accion: excluir
    parametros:
      columna_anio: Añoocu
    mensaje: "{n} nacimientos ocurrieron en otro año ({detalle}); se excluyen de la base del período."

  NAC_HIJOS_COHERENCIA:
    base: NACIMIENTOS
    nombre: Hijos tenidos distinto de vivos + muertos
    dimension: consistencia
    severidad: error
    accion: reportar
    mensaje: "{n} registros donde el total de hijos tenidos no es igual a vivos + nacidos muertos."

  # ------------------------- PNC detenidos -------------------------
  PNC_MAYOR_EDAD_COHERENCIA:
    base: DETENIDOS
    nombre: Mayor/menor de edad no coincide con la edad
    dimension: consistencia
    severidad: error
    accion: reportar
    mensaje: "{n} registros marcados MAYOR o MENOR que no coinciden con la edad."

  PNC_DIA_SEMANA_COHERENCIA:
    base: DETENIDOS
    nombre: Día de la semana no coincide con la fecha
    dimension: consistencia
    severidad: error
    accion: reportar
    mensaje: "{n} registros con un día de la semana distinto al de la fecha."

  PNC_MES_PERIODO:
    base: DETENIDOS
    nombre: Hecho fuera del mes de la carga
    dimension: oportunidad
    severidad: advertencia
    accion: reportar
    mensaje: "{n} registros con fecha fuera del período de la carga ({detalle})."

  # ------------------------- Emergencias -------------------------
  EMERG_SUBTIPO_AMENAZA:
    base: EMERGENCIAS
    nombre: Subtipo que no corresponde a la amenaza
    dimension: consistencia
    severidad: error
    accion: reportar
    mensaje: "{n} registros con un subtipo de amenaza que no pertenece a la amenaza indicada ({detalle})."

  EMERG_PERIODO:
    base: EMERGENCIAS
    nombre: Emergencia fuera del año de la carga
    dimension: oportunidad
    severidad: advertencia
    accion: reportar
    mensaje: "{n} emergencias con fecha fuera del año de la carga."
